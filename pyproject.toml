[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexlens"
version = "0.1.0"
description = "ApexLens: explainable Formula 1 performance intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3",
    "pyarrow>=15",
    "duckdb>=1.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "statsmodels>=0.14",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "joblib>=1.3",
]

[project.optional-dependencies]
fastf1 = ["fastf1>=3.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
apexlens = "apexlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test needs live network access to external data providers (skipped by default)",
    "realdata: test needs the locally ingested real dataset under data/ (skipped when absent)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
