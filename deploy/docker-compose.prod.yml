# Production: API + dashboard behind Caddy, which gets and renews a Let's Encrypt certificate by itself.
# Run from the repository root so that ./.env is used for the variables below:
#   docker compose --project-directory . -f deploy/docker-compose.prod.yml up -d --build
#   docker compose --project-directory . -f deploy/docker-compose.prod.yml --profile pipeline run --rm pipeline
# deploy/setup.sh does all of this on a fresh Ubuntu VM. Paths in this file are relative to deploy/.
name: apexlens

services:
  api:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      APEXLENS_API_CORS_ORIGINS: https://${APEXLENS_DOMAIN}
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    expose: ["8000"]
    logging:
      options: { max-size: "20m", max-file: "3" }

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on: [api]
    expose: ["80"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APEXLENS_DOMAIN: ${APEXLENS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # one-off: build the dataset and models (hours; needs outbound internet)
  pipeline:
    build:
      context: ..
    profiles: ["pipeline"]
    env_file: ../.env
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    command: >
      sh -c "python scripts/ingest_season.py --seasons $${SEASONS:-2022-2026} --telemetry &&
             python scripts/build_features.py &&
             python scripts/train_models.py &&
             python scripts/evaluate_models.py &&
             python scripts/generate_reports.py"

volumes:
  caddy_data:
  caddy_config:
